name: quote-probe
# Temporärer Diagnose-Lauf (wird danach wieder entfernt): Rechtsmittel-
# Aussagen auf den Quellseiten von baugesuch, parkplatz, sozialhilfe,
# veranstaltung. Nur Treffersätze mit Kontext, kein Volltext.
on:
  push:
    branches: [claude/hopeful-clarke-yu0b2c-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Saetze extrahieren
        working-directory: stadt-zuerich-next
        run: |
          cat > ./probe.mjs <<'JS'
          import { htmlToText, normWs } from './scripts/lib/html-text.mjs';
          const urls = {
            baugesuch: [
              'https://www.stadt-zuerich.ch/de/planen-und-bauen/baubewilligungen/bewilligungsprozess/baugesuch-einreichen.html',
              'https://www.stadt-zuerich.ch/de/planen-und-bauen/baubewilligungen/bewilligungsprozess/fristen-und-gebuehren.html',
              'https://www.stadt-zuerich.ch/de/planen-und-bauen/baubewilligungen/bewilligungsprozess.html',
              'https://www.zh.ch/de/planen-bauen/baubewilligung.html',
            ],
            parkplatz: [
              'https://www.stadt-zuerich.ch/de/mobilitaet/parkieren/parkbewilligungen/anwohnerparkkarte.html',
              'https://www.stadt-zuerich.ch/de/mobilitaet/parkieren/parkbewilligungen.html',
            ],
            sozialhilfe: [
              'https://www.zh.ch/de/soziales/sozialhilfe/sozialhilfehandbuch/flexdata-definition/1-grundlagen/1-2-verwaltung-und-rechtsmittelverfahren-im-kanton-zuerich/1-2-02-rechtsmittelverfahren-im-kantonalen-sozialhilferecht.html',
              'https://www.stadt-zuerich.ch/de/politik-und-verwaltung/stadtverwaltung/sd/sod.html',
            ],
            veranstaltung: [
              'https://www.stadt-zuerich.ch/de/stadtleben/veranstaltungen-und-bewilligungen/veranstaltungen/fest-sportveranstaltung-quartierfest.html',
              'https://www.stadt-zuerich.ch/de/stadtleben/veranstaltungen-und-bewilligungen/veranstaltungen.html',
            ],
          };
          const re = /(Rekurs|Einsprache|Neubeurteilung|Rechtsmittel|Bezirksrat|Statthalter|Baurekursgericht|Zustellung des baurechtlichen|baurechtlichen Entscheid|Beschwerde|anfechten)/i;
          for (const [pid, list] of Object.entries(urls)) for (const url of list) {
            let res, text = '';
            try { res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 maschinerie-zuerich-quote-probe/1.0', 'accept-language': 'de-CH,de;q=0.9' } }); text = normWs(htmlToText(await res.text())); }
            catch (e) { console.log(`\n=== [${pid}] ${url} FEHLER ${e.message}`); continue; }
            console.log(`\n=== [${pid}] ${url} [${res.status}] ${text.length} Zeichen`);
            const s = text.split(/(?<=[.!?])\s+/); const hit = new Set();
            s.forEach((x, i) => { if (re.test(x)) for (let k = i - 1; k <= i + 1; k++) if (k >= 0 && k < s.length) hit.add(k); });
            let last = -2;
            for (const i of [...hit].sort((a, b) => a - b)) { if (i !== last + 1) console.log('—'); console.log('• ' + s[i].slice(0, 380)); last = i; }
          }
          JS
          node ./probe.mjs
