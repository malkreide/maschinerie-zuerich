name: quote-probe
# Temporärer Diagnose-Lauf (wird danach wieder entfernt): Sätze zu SBU-
# Ablehnung/Rechtsmitteln mit je zwei Nachbarsätzen Kontext. Kein Volltext.
on:
  push:
    branches: [claude/hopeful-clarke-yu0b2c-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Saetze extrahieren
        working-directory: stadt-zuerich-next
        run: |
          cat > ./probe.mjs <<'JS'
          import { htmlToText, normWs } from './scripts/lib/html-text.mjs';
          const base = 'https://www.stadt-zuerich.ch/de/lebenslagen/jugend-und-familie/fruehe-kindheit/familienergaenzende-kinderbetreuung/';
          const urls = ['faq.html', 'betreuungskosten-und-subventionen.html'].map((u) => base + u);
          const re = /(abgelehnt|ablehn|Einsprache|Rekurs|Rechtsmittel|Verfügung|Neubeurteilung|Beschwerde|nicht einverstanden|gutgeheissen)/i;
          for (const url of urls) {
            const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 maschinerie-zuerich-quote-probe/1.0', 'accept-language': 'de-CH,de;q=0.9' } });
            const text = normWs(htmlToText(await res.text()));
            console.log(`\n=== ${url} [${res.status}]`);
            const s = text.split(/(?<=[.!?])\s+/);
            const hit = new Set();
            s.forEach((x, i) => { if (re.test(x)) for (let k = i - 2; k <= i + 2; k++) if (k >= 0 && k < s.length) hit.add(k); });
            let last = -2;
            for (const i of [...hit].sort((a, b) => a - b)) { if (i !== last + 1) console.log('—'); console.log('• ' + s[i].slice(0, 400)); last = i; }
          }
          JS
          node ./probe.mjs
