name: quote-probe
# Temporaerer Diagnose-Lauf (wird nach dem Lesen geloescht): zieht aus drei
# amtlichen Kita-Seiten nur die Saetze zu Beitragsfaktor/SBU/Warteliste,
# damit Belegstellen woertlich gesetzt werden koennen. Kein Volltext im Log.
on:
  push:
    branches: [claude/hopeful-clarke-yu0b2c-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Saetze extrahieren
        working-directory: stadt-zuerich-next
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import { htmlToText, normWs } from './scripts/lib/html-text.mjs';
          const base = 'https://www.stadt-zuerich.ch/de/lebenslagen/jugend-und-familie/fruehe-kindheit/familienergaenzende-kinderbetreuung/';
          const urls = ['faq.html', 'kitaplatz-finden.html', 'betreuungskosten-und-subventionen.html'].map((u) => base + u)
            .concat(['https://www.stadt-zuerich.ch/de/stadtleben/wirtschaft-und-gewerbe/fuer-kitas/subventionen.html']);
          const re = /(Vertrag|Betreuungsvertrag|Anmeldung|anmelden|bevor|zuerst|vorher|beantragen|Antrag|Gutschein|rückwirkend|Platz|Reihenfolge|Eintritt|Beginn|Kontrakt|Maximaltarif|Vollkosten)/i;
          for (const url of urls) {
            const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 maschinerie-zuerich-quote-probe/1.0', 'accept-language': 'de-CH,de;q=0.9' } });
            const text = normWs(htmlToText(await res.text()));
            console.log(`\n=== ${url} [${res.status}] ${text.length} Zeichen`);
            const sents = text.split(/(?<=[.!?])\s+/);
            for (const s of sents) if (re.test(s) && s.length < 400) console.log('• ' + s);
          }
          JS
          cp /tmp/probe.mjs ./probe.mjs && node ./probe.mjs
