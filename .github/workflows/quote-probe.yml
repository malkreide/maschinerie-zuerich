name: quote-probe
# Temporärer Diagnose-Lauf (wird danach wieder entfernt): Rechtsmittel-
# Bestimmungen in VO KB (AS 410.130) und Gemeindeordnung (AS 101.100).
on:
  push:
    branches: [claude/hopeful-clarke-yu0b2c-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PDFs holen und durchsuchen
        run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          B=https://www.stadt-zuerich.ch/dam/web/de/politik-verwaltung/politik-recht/amtliche-sammlung
          for u in "$B/410/130/410.130-vo-kb-01-2026-v17.pdf" "$B/101/100/101.100-gemeindeordnung-2025.11-v31.pdf"; do
            echo "=== $u"
            curl -sSL -A "Mozilla/5.0 maschinerie-zuerich-quote-probe/1.0" -o doc.pdf "$u" -w "HTTP %{http_code}\n"
            pdftotext -layout doc.pdf doc.txt
            grep -n -i -E -B3 -A6 "Neubeurteilung|Rekurs|Einsprache|Rechtsmittel|Rechtsschutz" doc.txt | cut -c1-220 | head -120
          done
